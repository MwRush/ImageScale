<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Redimensionnez vos images, conservez vos autres fichiers et exportez le tout dans une archive ZIP.">
    <title>Image Scale</title>
    <link rel="icon" type="image/png" href="website_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app_shell">
        <header class="topbar">
            <h1>Image Scale</h1>
        </header>

        <main>
            <input class="visually_hidden" type="file" id="file_input" multiple tabindex="-1">
            <button id="drop_zone" class="drop_zone" type="button" aria-labelledby="import_title">
                <svg class="drop_icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span id="import_title" class="drop_title">Ajouter vos fichiers</span>
            </button>
            <p id="import_status" class="visually_hidden" aria-live="polite"></p>

            <section id="workspace_section" class="workspace_section" hidden>
                <div class="section_heading">
                    <h2>Réglages</h2>
                    <button id="clear_button" class="text_button" type="button">Tout retirer</button>
                </div>

                <div class="settings_grid">
                    <div class="setting_control">
                        <div class="setting_label">
                            <label for="scale_slider">Facteur d’échelle</label>
                            <output id="scale_value" for="scale_slider">×2</output>
                        </div>
                        <input type="range" id="scale_slider" min="1" max="10" step="1" value="2">
                        <div class="range_limits" aria-hidden="true"><span>×1</span><span>×10</span></div>
                    </div>
                    <div class="setting_control">
                        <div class="setting_label">
                            <label for="loss_slider">Adoucissement</label>
                            <output id="loss_value" for="loss_slider">0%</output>
                        </div>
                        <input type="range" id="loss_slider" min="0" max="50" step="1" value="0">
                        <div class="range_limits" aria-hidden="true"><span>0%</span><span>50%</span></div>
                    </div>
                    <button id="process_button" class="button action_button" type="button">
                        <span>Préparer l’export</span>
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M13 6l6 6-6 6"></path>
                        </svg>
                    </button>
                </div>

                <div class="section_heading queue_heading">
                    <h2>Fichiers</h2>
                    <span id="selection_summary" class="selection_summary"></span>
                </div>

                <div id="queue_list" class="queue_list"></div>
            </section>

            <section id="results_section" class="results_section" hidden aria-labelledby="results_title">
                <div class="section_heading">
                    <h2 id="results_title">Export</h2>
                    <span id="result_summary" class="selection_summary"></span>
                </div>

                <div class="export_panel">
                    <div class="progress_block">
                        <div class="progress_copy">
                            <span id="progress_label">Prêt à traiter</span>
                            <span id="progress_value">0%</span>
                        </div>
                        <progress id="progress_bar" max="100" value="0">0%</progress>
                        <p id="live_status" class="status_message" aria-live="polite"></p>
                    </div>
                    <button id="download_zip_button" class="button primary_button zip_button" type="button" disabled>
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 3v12M7 10l5 5 5-5"></path>
                            <path d="M5 21h14"></path>
                        </svg>
                        <span>Télécharger le ZIP</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="zip_archive.js"></script>
    <script src="script.js"></script>
</body>
</html>
